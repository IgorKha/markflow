name: Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "**/__tests__/**"
      - "**/*.spec.ts"
  pull_request:
    branches:
      - main
    paths:
      - "**/__tests__/**"
      - "**/*.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:run
